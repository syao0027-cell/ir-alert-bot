name: IR Alert Bot

on:
  workflow_dispatch:

  schedule:
    # 日本時間 07:05
    - cron: '5 7 * * *'
      timezone: 'Asia/Tokyo'

    # 日本時間 12:20
    - cron: '20 12 * * *'
      timezone: 'Asia/Tokyo'

    # 日本時間 17:15
    - cron: '15 17 * * *'
      timezone: 'Asia/Tokyo'

    # 日本時間 20:05
    - cron: '5 20 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write


jobs:
  ir-alert:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # GitHubリポジトリを取得
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # PythonでIR取得・判定・LINE通知
      # ==========================================================

      - name: Fetch TDnet and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

        run: |

          python3 <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta


          # ==========================================================
          # 設定
          # ==========================================================

          API_URL = (
              "https://webapi.yanoshin.jp/"
              "webapi/tdnet/list/recent.json2?limit=300"
          )

          SEEN_FILE = "seen_ir.json"

          LINE_URL = (
              "https://api.line.me/"
              "v2/bot/message/broadcast"
          )

          JST = timezone(timedelta(hours=9))


          print("")
          print("========================================")
          print("        IR ALERT BOT START")
          print("========================================")
          print("")


          # ==========================================================
          # 現在時刻
          # ==========================================================

          now = datetime.now(JST)

          print(
              "実行時刻:",
              now.strftime("%Y-%m-%d %H:%M:%S"),
              "JST"
          )

          print("")


          # ==========================================================
          # 好材料キーワード
          # ==========================================================

          GOOD_KEYWORDS = {

              # 業績
              "上方修正": 5,
              "業績予想を上方修正": 5,
              "業績予想の上方修正": 5,
              "利益予想の上方修正": 5,

              "増益": 3,
              "増収": 3,
              "黒字転換": 5,
              "黒字化": 5,

              # 配当
              "増配": 5,
              "配当予想の増額": 5,
              "配当予想を増額": 5,
              "復配": 5,
              "記念配当": 3,

              # 自社株
              "自社株買い": 5,
              "自己株式取得": 5,
              "自己株式の取得": 5,
              "自己株式取得に係る事項": 5,

              # M&A・資本
              "TOB": 5,
              "公開買付け": 5,
              "株式公開買付け": 5,
              "買収": 5,
              "M&A": 5,
              "子会社化": 5,
              "株式取得": 4,
              "資本提携": 4,
              "業務提携": 3,
              "戦略的提携": 4,

              # 受注
              "大型受注": 5,
              "大口受注": 5,
              "大型案件": 4,
              "受注獲得": 4,

              # 新規事業
              "新規事業": 2,
              "新製品": 3,
              "新商品": 3,
              "新サービス": 2,
              "サービス開始": 2,

              # 技術
              "特許取得": 3,
              "特許登録": 3,

              # 株主還元
              "株主優待制度の拡充": 4,
              "株主優待の拡充": 4,
              "株主優待拡充": 4,
              "優待拡充": 4,

              # 財務
              "債務超過解消": 4,
              "財務改善": 2,
              "資産売却": 2,
              "固定資産の売却": 2,
              "特別利益": 2,
          }


          # ==========================================================
          # 悪材料キーワード
          # ==========================================================

          BAD_KEYWORDS = {

              # 業績
              "下方修正": -5,
              "業績予想を下方修正": -5,
              "業績予想の下方修正": -5,
              "利益予想の下方修正": -5,

              "赤字転落": -5,
              "赤字化": -5,
              "赤字": -3,

              "減益": -3,
              "減収": -3,

              # 配当
              "減配": -5,
              "配当予想の減額": -5,
              "配当予想を減額": -5,
              "無配": -5,

              # 希薄化
              "希薄化": -4,
              "公募増資": -4,
              "第三者割当": -4,
              "新株予約権": -4,
              "ストックオプション": -2,
              "CB": -4,
              "転換社債": -4,

              # 損失
              "特別損失": -3,

              # 財務悪化
              "債務超過": -5,
              "資金繰り": -3,
              "財務制限条項": -3,

              # 上場
              "上場廃止": -5,
              "上場廃止申請": -5,

              # 不祥事
              "不正": -5,
              "不適切": -4,
              "粉飾": -5,
              "虚偽": -5,
              "コンプライアンス違反": -5,

              # 法務
              "訴訟": -4,
              "行政処分": -5,
              "業務停止": -5,
              "損害賠償": -4,

              # 人事
              "解任": -3,
          }


          # ==========================================================
          # 優先度
          # ==========================================================

          def get_priority(score):

              value = abs(score)

              if value >= 10:
                  return 5

              if value >= 7:
                  return 4

              if value >= 5:
                  return 3

              if value >= 3:
                  return 2

              return 1


          def priority_stars(priority):

              stars = {
                  5: "★★★★★",
                  4: "★★★★☆",
                  3: "★★★☆☆",
                  2: "★★☆☆☆",
                  1: "★☆☆☆☆",
              }

              return stars.get(
                  priority,
                  "★☆☆☆☆"
              )


          # ==========================================================
          # IR分析
          # ==========================================================

          def analyze_ir(title):

              good_matches = []
              bad_matches = []

              good_score = 0
              bad_score = 0


              # ------------------------------------------------------
              # 好材料
              # ------------------------------------------------------

              for keyword, score in GOOD_KEYWORDS.items():

                  if keyword in title:

                      good_matches.append(keyword)

                      good_score += score


              # ------------------------------------------------------
              # 悪材料
              # ------------------------------------------------------

              for keyword, score in BAD_KEYWORDS.items():

                  if keyword in title:

                      bad_matches.append(keyword)

                      bad_score += score


              # ------------------------------------------------------
              # 複合材料ボーナス
              # ------------------------------------------------------

              if (
                  "上方修正" in title
                  and "増配" in title
              ):

                  good_score += 3


              if (
                  "上方修正" in title
                  and "自社株買い" in title
              ):

                  good_score += 3


              if (
                  "増配" in title
                  and "自社株買い" in title
              ):

                  good_score += 3


              if (
                  "大型受注" in title
                  and "上方修正" in title
              ):

                  good_score += 3


              if (
                  "大型受注" in title
                  and "増配" in title
              ):

                  good_score += 2


              # ------------------------------------------------------
              # 悪材料の複合
              # ------------------------------------------------------

              if (
                  "下方修正" in title
                  and "減配" in title
              ):

                  bad_score -= 3


              if (
                  "下方修正" in title
                  and "赤字" in title
              ):

                  bad_score -= 3


              if (
                  "赤字" in title
                  and "減配" in title
              ):

                  bad_score -= 3


              if (
                  "希薄化" in title
                  and "公募増資" in title
              ):

                  bad_score -= 3


              # ------------------------------------------------------
              # 判定
              # ------------------------------------------------------

              if (
                  good_score == 0
                  and bad_score == 0
              ):

                  return {
                      "category": "neutral",
                      "score": 0,
                      "priority": 0,
                      "matches": [],
                  }


              # 好材料優勢

              if good_score > abs(bad_score):

                  return {
                      "category": "good",
                      "score": good_score,
                      "priority": get_priority(
                          good_score
                      ),
                      "matches": good_matches,
                  }


              # 悪材料優勢

              if abs(bad_score) > good_score:

                  return {
                      "category": "bad",
                      "score": bad_score,
                      "priority": get_priority(
                          bad_score
                      ),
                      "matches": bad_matches,
                  }


              # 同点の場合
              # 強い悪材料が含まれる場合は悪材料優先

              if bad_score <= -5:

                  return {
                      "category": "bad",
                      "score": bad_score,
                      "priority": get_priority(
                          bad_score
                      ),
                      "matches": bad_matches,
                  }


              return {
                  "category": "good",
                  "score": good_score,
                  "priority": get_priority(
                      good_score
                  ),
                  "matches": good_matches,
              }


          # ==========================================================
          # TDnet取得
          # ==========================================================

          print("----------------------------------------")
          print("1. TDnetデータ取得")
          print("----------------------------------------")

          request = urllib.request.Request(

              API_URL,

              headers={
                  "User-Agent": "IR-Alert-Bot/1.0"
              }
          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  raw_data = response.read()

                  data = json.loads(
                      raw_data.decode("utf-8")
                  )


          except Exception as e:

              print("")
              print("❌ TDnet取得失敗")
              print("エラー:", repr(e))
              print("")

              raise


          items = data.get(
              "items",
              []
          )


          print(
              f"✅ TDnet取得成功: {len(items)}件"
          )

          print("")


          # ==========================================================
          # seen_ir.json
          # ==========================================================

          print("----------------------------------------")
          print("2. 重複チェック")
          print("----------------------------------------")


          if os.path.exists(SEEN_FILE):

              try:

                  with open(
                      SEEN_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      seen_ids = set(
                          str(x)
                          for x in json.load(f)
                      )

              except Exception:

                  print(
                      "⚠️ seen_ir.jsonを読み込めませんでした。"
                  )

                  seen_ids = set()

          else:

              seen_ids = set()


          print(
              f"既読IR: {len(seen_ids)}件"
          )


          # ==========================================================
          # 新規IR抽出
          # ==========================================================

          new_items = []


          for item in items:

              ir_id = str(
                  item.get("id", "")
              ).strip()


              if not ir_id:
                  continue


              if ir_id in seen_ids:
                  continue


              new_items.append(item)


          print(
              f"✅ 新規IR: {len(new_items)}件"
          )

          print("")


          # ==========================================================
          # 分類
          # ==========================================================

          print("----------------------------------------")
          print("3. IR分析")
          print("----------------------------------------")


          good_notifications = []
          bad_notifications = []

          neutral_count = 0


          for item in new_items:

              title = str(
                  item.get(
                      "title",
                      ""
                  )
              ).strip()


              result = analyze_ir(title)


              if result["category"] == "neutral":

                  neutral_count += 1

                  continue


              record = {

                  "id": str(
                      item.get(
                          "id",
                          ""
                      )
                  ),

                  "title": title,

                  "company_code": str(
                      item.get(
                          "company_code",
                          ""
                      )
                  ).strip(),

                  "company_name": str(
                      item.get(
                          "company_name",
                          ""
                      )
                  ).strip(),

                  "pubdate": str(
                      item.get(
                          "pubdate",
                          ""
                      )
                  ).strip(),

                  "document_url": str(
                      item.get(
                          "document_url",
                          ""
                      )
                  ).strip(),

                  "score": result["score"],

                  "priority": result["priority"],

                  "matches": result["matches"],
              }


              if result["category"] == "good":

                  good_notifications.append(
                      record
                  )

              elif result["category"] == "bad":

                  bad_notifications.append(
                      record
                  )


          # ==========================================================
          # 優先度順
          # ==========================================================

          good_notifications.sort(

              key=lambda x: (
                  x["priority"],
                  x["score"],
                  x["pubdate"],
              ),

              reverse=True
          )


          bad_notifications.sort(

              key=lambda x: (
                  x["priority"],
                  abs(x["score"]),
                  x["pubdate"],
              ),

              reverse=True
          )


          print(
              f"🟢 有望IR: {len(good_notifications)}件"
          )

          print(
              f"🔴 悪材料IR: {len(bad_notifications)}件"
          )

          print(
              f"⚪ 中立IR: {neutral_count}件"
          )

          print("")


          # ==========================================================
          # LINEメッセージ作成
          # ==========================================================

          sections = []


          # ==========================================================
          # 有望IR
          # ==========================================================

          if good_notifications:

              text = "🟢 有望IR\n"


              for ir in good_notifications:

                  text += (
                      "\n━━━━━━━━━━━━━━\n"
                  )


                  if ir["priority"] >= 5:

                      text += "🔥 最重要\n"

                  elif ir["priority"] >= 4:

                      text += "🟠 重要\n"

                  elif ir["priority"] >= 3:

                      text += "🟢 注目\n"

                  else:

                      text += "🟢 通常\n"


                  text += "\n"


                  code = ir["company_code"]

                  company = ir["company_name"]


                  if code:

                      text += (
                          f"{code} {company}\n"
                      )

                  else:

                      text += (
                          f"{company}\n"
                      )


                  text += (
                      f"{ir['title']}\n"
                  )


                  text += (
                      "\n📊 優先度："
                      + priority_stars(
                          ir["priority"]
                      )
                      + "\n"
                  )


                  matches = list(
                      dict.fromkeys(
                          ir["matches"]
                      )
                  )


                  if matches:

                      text += (
                          "📈 "
                          + "・".join(
                              matches[:5]
                          )
                          + "\n"
                      )


                  if ir["pubdate"]:

                      text += (
                          "🕐 "
                          + ir["pubdate"]
                          + "\n"
                      )


                  if ir["document_url"]:

                      text += (
                          "📎 "
                          + ir["document_url"]
                          + "\n"
                      )


              sections.append(text)


          # ==========================================================
          # 悪材料IR
          # ==========================================================

          if bad_notifications:

              text = "🔴 悪材料IR\n"


              for ir in bad_notifications:

                  text += (
                      "\n━━━━━━━━━━━━━━\n"
                  )


                  if ir["priority"] >= 5:

                      text += (
                          "🚨 最重要悪材料\n"
                      )

                  elif ir["priority"] >= 4:

                      text += (
                          "🔴 重要悪材料\n"
                      )

                  elif ir["priority"] >= 3:

                      text += (
                          "🟠 注目悪材料\n"
                      )

                  else:

                      text += (
                          "🔴 通常悪材料\n"
                      )


                  text += "\n"


                  code = ir["company_code"]

                  company = ir["company_name"]


                  if code:

                      text += (
                          f"{code} {company}\n"
                      )

                  else:

                      text += (
                          f"{company}\n"
                      )


                  text += (
                      f"{ir['title']}\n"
                  )


                  text += (
                      "\n📊 優先度："
                      + priority_stars(
                          ir["priority"]
                      )
                      + "\n"
                  )


                  matches = list(
                      dict.fromkeys(
                          ir["matches"]
                      )
                  )


                  if matches:

                      text += (
                          "⚠️ "
                          + "・".join(
                              matches[:5]
                          )
                          + "\n"
                      )


                  if ir["pubdate"]:

                      text += (
                          "🕐 "
                          + ir["pubdate"]
                          + "\n"
                      )


                  if ir["document_url"]:

                      text += (
                          "📎 "
                          + ir["document_url"]
                          + "\n"
                      )


              sections.append(text)


          # ==========================================================
          # LINE送信
          # ==========================================================

          print("----------------------------------------")
          print("4. LINE通知")
          print("----------------------------------------")


          if not sections:

              print(
                  "ℹ️ 通知対象IRはありません。"
              )

              print(
                  "➡️ LINE通知は行いません。"
              )


          else:

              header = (
                  "🔔 IR速報 "
                  + now.strftime("%H:%M")
                  + "\n"
              )


              footer = (
                  "\n━━━━━━━━━━━━━━\n"
                  "※自動判定です。\n"
                  "投資判断の前にIR原文をご確認ください。"
              )


              message = (
                  header
                  + "\n"
                  + "\n".join(sections)
                  + footer
              )


              # ------------------------------------------------------
              # LINEの文字数制限対策
              # ------------------------------------------------------

              MAX_LENGTH = 4800


              if len(message) > MAX_LENGTH:

                  print(
                      "⚠️ メッセージが長いため短縮します。"
                  )


                  message = (
                      message[:4500]
                      + "\n\n"
                      + "⚠️ IR件数が多いため一部省略"
                      + footer
                  )


              token = os.environ.get(
                  "LINE_CHANNEL_ACCESS_TOKEN"
              )


              if not token:

                  print(
                      "❌ LINE_CHANNEL_ACCESS_TOKEN がありません。"
                  )

                  raise RuntimeError(
                      "LINE_CHANNEL_ACCESS_TOKEN が未設定です。"
                  )


              payload = {

                  "messages": [

                      {
                          "type": "text",
                          "text": message
                      }

                  ]

              }


              request = urllib.request.Request(

                  LINE_URL,

                  data=json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8"),

                  headers={

                      "Content-Type":
                          "application/json",

                      "Authorization":
                          "Bearer " + token,
                  },

                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      status = response.status

                      print(
                          f"✅ LINE送信成功"
                      )

                      print(
                          f"HTTP Status: {status}"
                      )


              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )


                  print("")
                  print("❌ LINE送信失敗")
                  print(
                      "HTTP Status:",
                      e.code
                  )
                  print(
                      "Response:",
                      body
                  )
                  print("")


                  raise


          # ==========================================================
          # seen_ir.json更新
          # ==========================================================

          print("----------------------------------------")
          print("5. 既読データ保存")
          print("----------------------------------------")


          for item in new_items:

              ir_id = str(
                  item.get(
                      "id",
                      ""
                  )
              ).strip()


              if ir_id:

                  seen_ids.add(ir_id)


          # ----------------------------------------------------------
          # 最大1000件
          # ----------------------------------------------------------

          seen_list = list(
              seen_ids
          )


          if len(seen_list) > 1000:

              seen_list = seen_list[-1000:]


          with open(
              SEEN_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  seen_list,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"保存件数: {len(seen_list)}件"
          )


          print("")
          print("========================================")
          print("        IR ALERT BOT FINISHED")
          print("========================================")
          print("")

          PY


      # ==========================================================
      # seen_ir.jsonをGitHubに保存
      # ==========================================================

      - name: Save seen IR state
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add seen_ir.json


          if git diff --cached --quiet; then

            echo "seen_ir.jsonに変更はありません。"

          else

            git commit \
              -m "Update seen IR state"

            git push

          fi
